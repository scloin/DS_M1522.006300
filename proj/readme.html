<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>README</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown-light.min.css"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/markdown-it/dist/markdown-it.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

  <style>
    body {
      margin: 0;
      background: white;
    }

    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0 auto;
      padding: 45px;
      background: white;
    }

    /* 코드 블록 전체 */
    .code-block {
      position: relative;
      margin: 16px 0;
    }

    /* 오른쪽 위 언어 이름 */
    .code-lang {
      position: absolute;
      top: 8px;
      left: 12px;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      color: #656d76;

      user-select: none;
      z-index: 1;
    }

    .code-block pre {
      margin: 0 !important;
      padding-top: 32px !important;
    }

    .code-block pre code {
      font-family:
        ui-monospace,
        SFMono-Regular,
        SF Mono,
        Menlo,
        Consolas,
        Liberation Mono,
        monospace;
    }

    @media (max-width: 767px) {
      .markdown-body {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<article id="readme" class="markdown-body"></article>

<script>
  const languageNames = {
    html: "HTML",
    css: "CSS",

    js: "JavaScript",
    javascript: "JavaScript",

    ts: "TypeScript",
    typescript: "TypeScript",

    cpp: "C++",
    c: "C",
    java: "Java",

    py: "Python",
    python: "Python",

    md: "Markdown",
    markdown: "Markdown",

    txt: "Text",
    text: "Text",

    bash: "Bash",
    sh: "Shell",
    shell: "Shell",

    json: "JSON",
    yaml: "YAML",
    yml: "YAML",

    sql: "SQL",
    rust: "Rust",
    go: "Go",

    dockerfile: "Dockerfile"
  };

  const md = window.markdownit({
    html: true,
    linkify: true,
    typographer: true,

    highlight: function (str, lang) {
      if (lang && hljs.getLanguage(lang)) {
        return hljs.highlight(str, {
          language: lang
        }).value;
      }

      return md.utils.escapeHtml(str);
    }
  });

  /*
   * ```cpp
   * ...
   * ```
   *
   * 같은 fenced code block을 직접 렌더링
   */
  md.renderer.rules.fence = function(tokens, idx, options) {
    const token = tokens[idx];

    const info = token.info
      ? md.utils.unescapeAll(token.info).trim()
      : "";

    const lang = info.split(/\s+/)[0].toLowerCase();

    let code;

    if (lang && hljs.getLanguage(lang)) {
      code = hljs.highlight(token.content, {
        language: lang
      }).value;
    } else {
      code = md.utils.escapeHtml(token.content);
    }

    const label =
      languageNames[lang] ||
      (lang ? lang.toUpperCase() : "Text");

    const className = lang
      ? `language-${md.utils.escapeHtml(lang)}`
      : "";

    return `
      <div class="code-block">
        <div class="code-lang">${md.utils.escapeHtml(label)}</div>
        <pre><code class="hljs ${className}">${code}</code></pre>
      </div>
    `;
  };

  fetch("./readme.md")
    .then(res => res.text())
    .then(text => {
      document.getElementById("readme").innerHTML = md.render(text);
    });
</script>

</body>
</html>
